[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-manager"
version = "2.1.3"
description = "一站式 AI 会话管理与 Token 用量工作台：Claude Code / Codex / DSH / WorkBuddy / ZCode"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
claude-session-manager = "session_manager.server:main"
ai-session-manager = "session_manager.server:main"
session-manager = "session_manager.core:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
session_manager = ["webui/*.html", "webui/vendor/*"]
